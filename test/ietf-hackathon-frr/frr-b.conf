frr defaults datacenter
hostname frr-b
password frr
service integrated-vtysh-config
log stdout
!
! The external network flapmusik does not own. One dot1q subinterface per
! eBGP session, matching /netinfra/peering-interface on xrd-a. The kernel
! creates these links (frr-b-vlans.sh); zebra only addresses them.
!
