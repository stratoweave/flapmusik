!
! "timers connect 1" is the whole point of this variant: it is the
! ConnectRetry timer, which IOS XR exposes nowhere. FRR leaves Idle after
! about a second and re-opens the TCP connection, so a cleared session is
! back in ~1-2 s instead of the ~30-45 s two XRd routers take to redial.
router bgp 65000
 bgp router-id 10.123.1.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
!
